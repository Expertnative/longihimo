<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LONGi Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#ffffff;
    text-align:center;
    padding:40px 20px;
}

.logo{
    width:320px;
    max-width:90%;
    margin-bottom:40px;
}

.search-area{
    margin-bottom:30px;
}

input{
    width:350px;
    max-width:90%;
    padding:14px;
    font-size:18px;
    border:2px solid #ddd;
    border-radius:8px;
}

button{
    padding:14px 24px;
    background:#e60012;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    opacity:0.9;
}

#result img{
    max-width:450px;
    width:100%;
    border-radius:12px;
    margin-top:20px;
}

.message{
    margin-top:20px;
    font-size:22px;
    color:#666;
}
</style>
</head>
<body>

<img src="logo.png" class="logo" alt="LONGi Logo">

<div class="search-area">
    <input type="text" id="searchBox" placeholder="Enter Code">
    <button onclick="searchItem()">Search</button>
</div>

<div id="result"></div>

<script>
function searchItem(){

    let code = document.getElementById("searchBox").value.trim();
    let result = document.getElementById("result");

    if(code === "cat"){
        result.innerHTML =
        '<img src="query.jpg" alt="query">';
    }
    else if(code === "dog"){
        result.innerHTML =
        '<img src="dog.png" alt="Dog">';
    }
    else{
        result.innerHTML =
        '<div class="message">No Result Found</div>';
    }
}
</script>

</body>
</html>
